<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Table Tennis Tournament Scores</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body.match-detail-page .victories {
                display: grid;
                grid-template-columns: minmax(470px, 0.9fr) minmax(640px, 1.15fr);
                align-items: start;
                gap: clamp(22px, 2.4vw, 42px);
                width: min(1760px, 100%);
            }

            body.match-detail-page .scoreboard {
                gap: clamp(7px, 0.9vh, 10px);
            }

            body.match-detail-page .victories > .scoreboard::before,
            body.match-detail-page .victories > .match-details::before {
                display: block;
                padding: clamp(7px, 0.9vh, 10px) clamp(14px, 1.4vw, 20px);
                border-left: 7px solid #FFD700;
                background: rgba(255, 215, 0, 0.14);
                color: #FFD700;
                font-size: clamp(1.15rem, 1.3vw, 1.65rem);
                font-weight: bold;
                letter-spacing: 0.08em;
                line-height: 1;
                text-transform: uppercase;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
            }

            body.match-detail-page .victories > .scoreboard::before {
                content: "Résultats";
            }

            body.match-detail-page .victories > .match-details::before {
                content: "Matchs";
                grid-column: 1 / -1;
                border-left-color: #357EDD;
                background: rgba(53, 126, 221, 0.18);
                color: white;
            }

            body.match-detail-page .player-row {
                min-height: clamp(54px, 6.8vh, 72px);
                padding: clamp(7px, 0.9vh, 11px) clamp(14px, 1.4vw, 20px);
                font-size: clamp(1.85rem, 2.15vw, 2.65rem);
            }

            body.match-detail-page .player-score {
                font-size: clamp(2.6rem, 3vw, 3.6rem);
            }

            .match-details {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: clamp(7px, 0.82vh, 10px);
                width: 100%;
            }

            .match-row {
                display: grid;
                grid-template-columns: minmax(58px, auto) minmax(0, 1fr) minmax(58px, auto);
                grid-template-areas:
                    "time playerA result"
                    "time playerB result";
                align-items: center;
                column-gap: clamp(8px, 0.9vw, 14px);
                row-gap: 2px;
                min-height: clamp(56px, 6vh, 68px);
                padding: clamp(6px, 0.7vh, 9px) clamp(10px, 1vw, 14px);
                border-left: 7px solid rgba(255, 215, 0, 0.85);
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.025));
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
                text-transform: uppercase;
            }

            .match-row.is-upcoming {
                border-left-color: rgba(53, 126, 221, 0.9);
            }

            .match-time {
                grid-area: time;
                color: #FFD700;
                font-size: clamp(0.9rem, 1vw, 1.25rem);
                font-weight: bold;
                line-height: 1;
                white-space: nowrap;
            }

            .match-player {
                min-width: 0;
                color: white;
                font-size: clamp(1rem, 1.12vw, 1.38rem);
                line-height: 1;
                overflow-wrap: anywhere;
                text-shadow: 0 7px 18px rgba(0, 0, 0, 0.45);
            }

            .match-player-a {
                grid-area: playerA;
            }

            .match-player-b {
                grid-area: playerB;
            }

            .match-result {
                grid-area: result;
                display: grid;
                gap: 2px;
                justify-self: end;
                justify-items: end;
                color: #FFD700;
                font-size: clamp(1rem, 1.15vw, 1.45rem);
                font-weight: bold;
                line-height: 1;
                text-align: right;
                white-space: nowrap;
            }

            .match-sets {
                color: rgba(255, 255, 255, 0.74);
                font-size: clamp(0.55rem, 0.6vw, 0.72rem);
                letter-spacing: 0.04em;
                text-align: right;
            }

            .match-empty {
                padding: clamp(20px, 2.8vh, 32px);
                border-left: 8px solid #357EDD;
                background: linear-gradient(90deg, rgba(53, 126, 221, 0.22), rgba(255, 255, 255, 0.025));
                color: white;
                font-size: clamp(2rem, 2.4vw, 3rem);
                font-weight: bold;
                text-transform: uppercase;
            }

            body.match-detail-page .scoreboard-row.is-winner-known {
                border-left-color: #00E5FF;
                background: linear-gradient(90deg, rgba(255, 215, 0, 0.2), rgba(0, 229, 255, 0.08));
                box-shadow: 0 12px 26px rgba(0, 229, 255, 0.2);
            }

            .winner-tag {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-left: clamp(10px, 1vw, 16px);
                padding: clamp(4px, 0.45vh, 6px) clamp(9px, 0.85vw, 12px);
                background: #FFD700;
                color: #171717;
                font-size: clamp(0.8rem, 0.75vw, 1rem);
                font-weight: bold;
                line-height: 1;
                white-space: nowrap;
                vertical-align: middle;
            }

            @media (max-width: 1200px) {
                body.match-detail-page .victories {
                    grid-template-columns: 1fr;
                }

                .match-details {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <script>
            const sheetProxyBaseUrl = window.location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
            const publishedSheetGids = {
                'Classements': '1397749265',
                'Classement Clubs': '1047108966',
                'Liste Matches': '1785200447',
                'NAT': '1312760054',
                'PROV-1': '490688118',
                'PROV-2': '897982353',
                'PROV-3': '1506993435',
                'PROV-4': '677604225',
                'PROV-5': '1829480529',
                'PROV-6': '1356197496'
            };

            const controlStorageKey = 'top6-display-settings-v1';
            const runtimeStorageKey = 'top6-display-runtime-v1';
            const commandStorageKey = 'top6-display-command-v1';
            const controlChannelName = 'top6-display-control';
            const controlClientId = `display-${Date.now()}-${Math.random().toString(16).slice(2)}`;

            const defaultSlideVisibility = {
                slide0: true,   // Logo Slide
                slide1: true,   // National Division
                slide2: true,   // P1 Division
                slide3: true,   // P2 Division
                slide4: true,   // P3 Division
                slide5: true,   // P4 Division
                slide6: true,   // P5 Division
                slide7: true,   // P6 Division
                slide9: false,  // Club Ranking
                slide10: false, // Sponsors Page 1
                slide11: false  // Sponsors Page 2
            };

            const defaultDivisionStatus = {
                national: { isFinished: true },
                p1: { isFinished: false },
                p2: { isFinished: true },
                p3: { isFinished: true },
                p4: { isFinished: true },
                p5: { isFinished: true },
                p6: { isFinished: true }
            };

            const knownWinnerDivisions = {
                national: true,
                p2: true,
                p3: true,
                p4: true,
                p5: true,
                p6: true
            };

            const scoreboardDivisions = {
                scoreTable1: 'national',
                scoreTable2: 'p1',
                scoreTable3: 'p2',
                scoreTable4: 'p3',
                scoreTable5: 'p4',
                scoreTable6: 'p5',
                scoreTable7: 'p6'
            };

            const defaultDisplaySettings = {
                slideVisibility: defaultSlideVisibility,
                divisionStatus: defaultDivisionStatus,
                rotationDurationMs: 15000,
                refreshIntervalMs: 30000,
                isPaused: false
            };

            // Slideshow state
            let currentSlide = 0;
            const allSlides = document.querySelectorAll('.slide');
            let slides = [];
            let slideshowInterval;
            let refreshInterval;
            let runtimeHeartbeatInterval;
            let isTransitioning = false;
            let fadeOverlay;
            let slideProgressBar;
            let controlChannel = null;

            function safeReadJson(key) {
                try {
                    const rawValue = window.localStorage.getItem(key);
                    return rawValue ? JSON.parse(rawValue) : null;
                } catch (error) {
                    console.warn(`Unable to read ${key}:`, error);
                    return null;
                }
            }

            function safeWriteJson(key, value) {
                try {
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    console.warn(`Unable to write ${key}:`, error);
                }
            }

            function normalizeDuration(value, fallback, min, max) {
                const numberValue = Number(value);
                if (!Number.isFinite(numberValue)) {
                    return fallback;
                }

                return Math.min(Math.max(numberValue, min), max);
            }

            function normalizeDivisionStatus(status) {
                const normalized = {};

                Object.entries(defaultDivisionStatus).forEach(([key, defaultStatus]) => {
                    normalized[key] = {
                        isFinished: Boolean(status?.[key]?.isFinished ?? defaultStatus.isFinished)
                    };
                });

                return normalized;
            }

            function normalizeDisplaySettings(settings) {
                const source = settings && typeof settings === 'object' ? settings : {};
                const sourceVisibility = source.slideVisibility || {};
                const normalizedSlideVisibility = {};

                Object.entries(defaultSlideVisibility).forEach(([key, isVisible]) => {
                    normalizedSlideVisibility[key] = Boolean(sourceVisibility[key] ?? isVisible);
                });

                if (!Object.values(normalizedSlideVisibility).some(Boolean)) {
                    normalizedSlideVisibility.slide0 = true;
                }

                return {
                    slideVisibility: normalizedSlideVisibility,
                    divisionStatus: normalizeDivisionStatus(source.divisionStatus),
                    rotationDurationMs: normalizeDuration(
                        source.rotationDurationMs,
                        defaultDisplaySettings.rotationDurationMs,
                        5000,
                        300000
                    ),
                    refreshIntervalMs: normalizeDuration(
                        source.refreshIntervalMs,
                        defaultDisplaySettings.refreshIntervalMs,
                        10000,
                        600000
                    ),
                    isPaused: Boolean(source.isPaused ?? defaultDisplaySettings.isPaused)
                };
            }

            let storedSettings = normalizeDisplaySettings(safeReadJson(controlStorageKey));
            let slideVisibility = { ...storedSettings.slideVisibility };
            let divisionStatus = normalizeDivisionStatus(storedSettings.divisionStatus);
            let rotationDurationMs = defaultDisplaySettings.rotationDurationMs;
            let refreshIntervalMs = storedSettings.refreshIntervalMs;
            let isPaused = storedSettings.isPaused;

            function getDisplaySettings() {
                return {
                    slideVisibility: { ...slideVisibility },
                    divisionStatus: normalizeDivisionStatus(divisionStatus),
                    rotationDurationMs,
                    refreshIntervalMs,
                    isPaused
                };
            }

            function postControlMessage(message) {
                if (!controlChannel) {
                    return;
                }

                controlChannel.postMessage({
                    ...message,
                    clientId: controlClientId,
                    sentAt: Date.now()
                });
            }

            function publishDisplaySettings(reason = 'settings') {
                const settings = getDisplaySettings();
                safeWriteJson(controlStorageKey, settings);
                postControlMessage({ type: 'settings', reason, settings });
            }

            function publishRuntimeState() {
                const activeSlide = slides[currentSlide] || null;
                const runtimeState = {
                    currentSlideId: activeSlide?.id || null,
                    currentSlideIndex: currentSlide,
                    totalSlides: slides.length,
                    isPaused,
                    updatedAt: Date.now()
                };

                safeWriteJson(runtimeStorageKey, runtimeState);
                postControlMessage({ type: 'runtime', runtime: runtimeState });
            }

            function resetSlideProgress() {
                if (!slideProgressBar) {
                    return;
                }

                slideProgressBar.classList.remove('is-running');
                slideProgressBar.style.animationDuration = `${rotationDurationMs}ms`;
                void slideProgressBar.offsetWidth;
                slideProgressBar.classList.add('is-running');
            }

            function applyDisplaySettings(settings, options = {}) {
                const normalized = normalizeDisplaySettings(settings);
                const divisionChanged = JSON.stringify(divisionStatus) !== JSON.stringify(normalized.divisionStatus);
                const timingChanged = rotationDurationMs !== normalized.rotationDurationMs
                    || refreshIntervalMs !== normalized.refreshIntervalMs;

                slideVisibility = { ...normalized.slideVisibility };
                divisionStatus = normalizeDivisionStatus(normalized.divisionStatus);
                rotationDurationMs = normalized.rotationDurationMs;
                refreshIntervalMs = normalized.refreshIntervalMs;
                isPaused = normalized.isPaused;

                document.body.classList.toggle('paused', isPaused);

                if (allSlides.length > 0) {
                    updateSlideVisibility();
                    const activeSlide = Array.from(allSlides).find(slide => slide.classList.contains('active'));

                    if (slides.length > 0 && (!activeSlide || !slideVisibility[activeSlide.id])) {
                        currentSlide = 0;
                        showSlide(0);
                    } else if (activeSlide) {
                        const activeIndex = slides.findIndex(slide => slide.id === activeSlide.id);
                        currentSlide = activeIndex >= 0 ? activeIndex : 0;
                    }
                }

                if (timingChanged && slideshowInterval) {
                    startSlideshow();
                }

                if (timingChanged) {
                    resetSlideProgress();
                }

                if (timingChanged && refreshInterval) {
                    startDataRefresh();
                }

                if (divisionChanged && options.refreshScores !== false) {
                    loadScores();
                }

                if (options.persist) {
                    safeWriteJson(controlStorageKey, getDisplaySettings());
                }

                if (options.broadcast) {
                    postControlMessage({
                        type: 'settings',
                        reason: options.reason || 'settings',
                        settings: getDisplaySettings()
                    });
                }

                publishRuntimeState();
            }

            function setPaused(paused, options = {}) {
                isPaused = Boolean(paused);
                document.body.classList.toggle('paused', isPaused);

                if (options.persist !== false) {
                    publishDisplaySettings('pause');
                }

                publishRuntimeState();
                console.log('Slideshow paused:', isPaused);
            }

            function handleRemoteCommand(command, payload = {}) {
                switch (command) {
                    case 'previous':
                        showSlide(currentSlide - 1);
                        break;
                    case 'next':
                        showSlide(currentSlide + 1);
                        break;
                    case 'goToSlide': {
                        const targetIndex = slides.findIndex(slide => slide.id === payload.slideId);
                        if (targetIndex >= 0) {
                            showSlide(targetIndex);
                        }
                        break;
                    }
                    case 'setPaused':
                        setPaused(payload.paused);
                        break;
                    case 'refreshData':
                        sheetCache.clear();
                        loadScores();
                        publishRuntimeState();
                        break;
                    case 'resetSettings':
                        applyDisplaySettings(defaultDisplaySettings, {
                            persist: true,
                            broadcast: true,
                            reason: 'reset'
                        });
                        loadScores();
                        break;
                }
            }

            function handleRemoteMessage(message) {
                if (!message || message.clientId === controlClientId) {
                    return;
                }

                if (message.type === 'settings') {
                    applyDisplaySettings(message.settings, { refreshScores: true });
                }

                if (message.type === 'command') {
                    handleRemoteCommand(message.command, message.payload || {});
                }

                if (message.type === 'request-state') {
                    publishDisplaySettings('state-request');
                    publishRuntimeState();
                }
            }

            function setupRemoteControl() {
                if (window.RealtimeChannel || 'BroadcastChannel' in window) {
                    controlChannel = window.RealtimeChannel
                        ? new RealtimeChannel(controlChannelName)
                        : new BroadcastChannel(controlChannelName);
                    controlChannel.onmessage = event => handleRemoteMessage(event.data);
                }

                window.addEventListener('storage', event => {
                    if (event.key === controlStorageKey && event.newValue) {
                        try {
                            applyDisplaySettings(JSON.parse(event.newValue), { refreshScores: true });
                        } catch (error) {
                            console.warn('Unable to apply remote settings:', error);
                        }
                    }

                    if (event.key === commandStorageKey && event.newValue) {
                        try {
                            const message = JSON.parse(event.newValue);
                            if (message.clientId !== controlClientId) {
                                handleRemoteCommand(message.command, message.payload || {});
                            }
                        } catch (error) {
                            console.warn('Unable to apply remote command:', error);
                        }
                    }
                });

                publishDisplaySettings('display-ready');
                publishRuntimeState();

                if (runtimeHeartbeatInterval) {
                    clearInterval(runtimeHeartbeatInterval);
                }
                runtimeHeartbeatInterval = setInterval(publishRuntimeState, 5000);
            }

            // Function to update slide visibility and refresh slides array
            function updateSlideVisibility() {
                allSlides.forEach(slide => {
                    const slideId = slide.id;
                    const isVisible = slideVisibility[slideId];
                    const isActive = slide.classList.contains('active');
                    slide.style.display = isVisible ? 'flex' : 'none';
                    slide.style.opacity = isVisible && isActive ? '1' : '0';
                });

                // Update slides array to only include visible slides
                slides = Array.from(allSlides).filter(slide => slideVisibility[slide.id]);
                console.log('Updated slides array:', slides.map(s => s.id));
            }

            // Function to toggle slide visibility
            function toggleSlideVisibility(slideId) {
                if (slideVisibility.hasOwnProperty(slideId)) {
                    slideVisibility[slideId] = !slideVisibility[slideId];
                    updateSlideVisibility();

                    if (!Object.values(slideVisibility).some(Boolean)) {
                        slideVisibility[slideId] = true;
                        updateSlideVisibility();
                    }

                    // If current slide is now hidden, go to next visible slide
                    if (!slideVisibility[slides[currentSlide]?.id]) {
                        currentSlide = 0;
                        showSlide(currentSlide);
                    }

                    publishDisplaySettings('slide-visibility');
                    publishRuntimeState();
                    console.log(`Toggled ${slideId} visibility:`, slideVisibility[slideId]);
                }
            }

            // Function to show a specific slide with fade-to-black transition
            function showSlide(index) {
                if (isTransitioning || slides.length === 0) return; // Prevent overlapping transitions

                if (index < 0) index = slides.length - 1;
                if (index >= slides.length) index = 0;

                const targetSlide = slides[index];
                if (!targetSlide) return;

                if (!fadeOverlay) {
                    allSlides.forEach(slide => {
                        slide.classList.remove('active');
                        slide.style.opacity = '0';
                    });

                    targetSlide.classList.add('active');
                    targetSlide.style.display = 'flex';
                    targetSlide.style.opacity = '1';
                    currentSlide = index;
                    resetSlideProgress();
                    publishRuntimeState();
                    return;
                }

                isTransitioning = true;

                fadeOverlay.classList.remove('is-wiping');
                void fadeOverlay.offsetWidth;
                fadeOverlay.classList.add('is-wiping');

                setTimeout(() => {
                    if (!slideVisibility[targetSlide.id]) {
                        isTransitioning = false;
                        showSlide(0);
                        return;
                    }

                    // Remove active class from all slides (including hidden ones)
                    allSlides.forEach(slide => {
                        slide.classList.remove('active');
                        slide.style.opacity = '0';
                    });

                    // Add active class and set opacity for the current visible slide
                    targetSlide.classList.add('active');
                    targetSlide.style.display = 'flex';
                    targetSlide.style.opacity = '1';
                    currentSlide = slides.findIndex(slide => slide.id === targetSlide.id);
                    if (currentSlide < 0) {
                        currentSlide = 0;
                    }
                    resetSlideProgress();

                    setTimeout(() => {
                        isTransitioning = false;
                        fadeOverlay.classList.remove('is-wiping');
                    }, 520);

                    publishRuntimeState();
                    console.log('Showing slide:', currentSlide, 'Slide ID:', targetSlide.id);
                }, 430);
            }

            // Function to start the slideshow
            function startSlideshow() {
                if (slideshowInterval) clearInterval(slideshowInterval);
                slideshowInterval = setInterval(() => {
                    if (!isPaused && slides.length > 0) {
                        currentSlide = (currentSlide + 1) % slides.length;
                        console.log('Auto-advancing to slide:', currentSlide, 'Slide ID:', slides[currentSlide]?.id);
                        showSlide(currentSlide);
                    }
                }, rotationDurationMs);
            }

            // Function to start data refresh
            function startDataRefresh() {
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(() => {
                    console.log('Refreshing data...');
                    loadScores();
                }, refreshIntervalMs);
            }

            // Function to toggle pause
            function togglePause() {
                setPaused(!isPaused);
            }

            // Keyboard controls
            document.addEventListener('keydown', (event) => {
                switch(event.key) {
                    case 'ArrowLeft':
                        showSlide(currentSlide - 1);
                        break;
                    case 'ArrowRight':
                        showSlide(currentSlide + 1);
                        break;
                    case ' ':
                        togglePause();
                        break;
                }
            });

            // Initial setup
            window.onload = function() {
                console.log('Page loaded, initializing...');
                fadeOverlay = document.getElementById('fadeOverlay');
                slideProgressBar = document.getElementById('slideProgressBar');
                document.body.classList.toggle('paused', isPaused);
                updateSlideVisibility(); // Initialize slide visibility

                console.log('Slides available:', slides.length);
                console.log('isPaused:', isPaused);

                // Set initial slide opacity without transition
                if (slides.length > 0) {
                    allSlides.forEach(slide => {
                        slide.classList.remove('active');
                        slide.style.opacity = '0';
                    });
                    slides[0].style.opacity = '1';
                    slides[0].classList.add('active');
                    resetSlideProgress();
                    console.log('Initial slide set:', slides[0].id);
                }

                loadScores();
                startSlideshow();
                startDataRefresh();
                setupRemoteControl();
                console.log('Slideshow started, interval:', slideshowInterval);
                console.log('Data refresh started, interval:', refreshInterval);
            };

            // Define the ranges for each table
            const ranges = {
                national: 'NAT!D39:O45',
                p1: 'PROV-1!D39:O45',
                p2: 'PROV-2!D39:O45',
                p3: 'PROV-3!D39:O45',
                p4: 'PROV-4!D39:O45',
                p5: 'PROV-5!D39:O45',
                p6: 'PROV-6!D39:O45',
                clubs: 'Classement Clubs!C5:D22',
                matches: 'Liste Matches!B3:K107'
            };

            const sheetCache = new Map();

            function parseCsv(csvText) {
                const rows = [];
                let row = [];
                let value = '';
                let inQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"' && inQuotes && nextChar === '"') {
                        value += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(value);
                        value = '';
                    } else if ((char === '\n' || char === '\r') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                        row.push(value);
                        rows.push(row);
                        row = [];
                        value = '';
                    } else {
                        value += char;
                    }
                }

                if (value || row.length > 0) {
                    row.push(value);
                    rows.push(row);
                }

                return rows;
            }

            function columnToIndex(columnName) {
                return columnName.split('').reduce((index, letter) => {
                    return index * 26 + letter.charCodeAt(0) - 64;
                }, 0) - 1;
            }

            function parseRange(range) {
                const match = range.match(/^(.+)!([A-Z]+)(\d+):([A-Z]+)(\d+)$/);
                if (!match) {
                    throw new Error(`Unsupported range format: ${range}`);
                }

                return {
                    sheetName: match[1],
                    startCol: columnToIndex(match[2]),
                    startRow: Number(match[3]) - 1,
                    endCol: columnToIndex(match[4]),
                    endRow: Number(match[5]) - 1
                };
            }

            function isUnavailable(value) {
                return !value || value === '#N/A' || value === 'N/A';
            }

            async function fetchPublishedSheet(sheetName) {
                const gid = publishedSheetGids[sheetName];

                if (!gid) {
                    throw new Error(`Unknown published sheet: ${sheetName}`);
                }

                const now = Date.now();
                const cached = sheetCache.get(sheetName);

                if (cached && now - cached.fetchedAt < 25000) {
                    if (cached.promise) {
                        return cached.promise;
                    }

                    return cached.rows;
                }

                const url = `${sheetProxyBaseUrl}/sheet?gid=${gid}&_=${now}`;
                const request = fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        return response.text();
                    })
                    .then(csvText => {
                        const rows = parseCsv(csvText);
                        sheetCache.set(sheetName, { rows, fetchedAt: Date.now() });
                        return rows;
                    })
                    .catch(error => {
                        sheetCache.delete(sheetName);
                        throw error;
                    });

                sheetCache.set(sheetName, { promise: request, fetchedAt: now });
                return request;
            }

            async function fetchRangeValues(range) {
                const parsedRange = parseRange(range);
                const rows = await fetchPublishedSheet(parsedRange.sheetName);

                return rows
                    .slice(parsedRange.startRow, parsedRange.endRow + 1)
                    .map(row => row.slice(parsedRange.startCol, parsedRange.endCol + 1));
            }

            function mapRankingRows(rows) {
                return rows
                    .map((row, index) => {
                        if (row[0] === 'Classement' || row[1] === 'Nom') {
                            return null;
                        }

                        if (row.length >= 6 && !isUnavailable(row[0]) && !isUnavailable(row[1]) && !isUnavailable(row[5])) {
                            return {
                                rank: row[0],
                                name: row[1],
                                score: row[5]
                            };
                        }

                        if (row.length >= 2 && !isUnavailable(row[0]) && !isUnavailable(row[1])) {
                            return {
                                rank: String(index + 1),
                                name: row[0],
                                score: row[1]
                            };
                        }

                        return null;
                    })
                    .filter(Boolean);
            }

            function scoreAsNumber(score) {
                const value = Number(String(score).replace(',', '.').trim());
                return Number.isFinite(value) ? value : 0;
            }

            function renderStartingSoon(scoreboardDiv) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'starting-soon';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'starting-soon-title';
                titleDiv.textContent = 'Ça va commencer';

                const subtitleDiv = document.createElement('div');
                subtitleDiv.className = 'starting-soon-subtitle';
                subtitleDiv.textContent = 'Les joueurs sont prêts, les premiers résultats arrivent bientôt.';

                messageDiv.appendChild(titleDiv);
                messageDiv.appendChild(subtitleDiv);
                scoreboardDiv.appendChild(messageDiv);
            }

            function isWinnerKnownForTable(tableId) {
                const divisionKey = scoreboardDivisions[tableId];

                if (!divisionKey) {
                    return false;
                }

                return Boolean(knownWinnerDivisions[divisionKey] || divisionStatus[divisionKey]?.isFinished);
            }

            const listMatchColumns = {
                series: 0,
                matchNumber: 1,
                playerA: 2,
                playerB: 3,
                table: 5,
                time: 6,
                round: 7,
                score: 9
            };

            function isEncodedScore(score) {
                return !isUnavailable(score) && score !== '0-0';
            }

            function mapMatchRows(rows, series) {
                return rows
                    .map(row => {
                        const rowSeries = row[listMatchColumns.series]?.trim();
                        const playerA = row[listMatchColumns.playerA]?.trim();
                        const playerB = row[listMatchColumns.playerB]?.trim();
                        const time = row[listMatchColumns.time]?.trim();
                        const score = row[listMatchColumns.score]?.trim();

                        if (rowSeries !== series || isUnavailable(playerA) || isUnavailable(playerB)) {
                            return null;
                        }

                        const isFinished = isEncodedScore(score);

                        return {
                            playerA,
                            playerB,
                            time,
                            result: isFinished ? score : 'À venir',
                            sets: [],
                            isFinished
                        };
                    })
                    .filter(Boolean);
            }

            function renderMatchDetails(container, matches) {
                container.innerHTML = '';

                if (matches.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'match-empty';
                    emptyDiv.textContent = 'Les matchs détaillés arrivent bientôt';
                    container.appendChild(emptyDiv);
                    return;
                }

                matches.forEach(match => {
                    const matchRow = document.createElement('div');
                    matchRow.className = `match-row ${match.isFinished ? 'is-finished' : 'is-upcoming'}`;

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'match-time';
                    timeDiv.textContent = match.time || '--';

                    const playerADiv = document.createElement('div');
                    playerADiv.className = 'match-player match-player-a';
                    playerADiv.textContent = match.playerA;

                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'match-result';
                    resultDiv.textContent = match.result;

                    if (match.sets.length > 0) {
                        const setsDiv = document.createElement('div');
                        setsDiv.className = 'match-sets';
                        setsDiv.textContent = match.sets.join('  ');
                        resultDiv.appendChild(setsDiv);
                    }

                    const playerBDiv = document.createElement('div');
                    playerBDiv.className = 'match-player match-player-b';
                    playerBDiv.textContent = match.playerB;

                    matchRow.appendChild(timeDiv);
                    matchRow.appendChild(playerADiv);
                    matchRow.appendChild(resultDiv);
                    matchRow.appendChild(playerBDiv);
                    container.appendChild(matchRow);
                });
            }

            async function fetchMatchDetails(range, tableId, series) {
                try {
                    console.log(`Fetching match details for ${tableId} with range ${range} and series ${series}`);
                    const rows = await fetchRangeValues(range);
                    const container = document.getElementById(tableId);

                    if (!container) {
                        console.error(`Match details element not found: ${tableId}`);
                        return;
                    }

                    renderMatchDetails(container, mapMatchRows(rows, series));
                } catch (error) {
                    console.error('Error fetching match details:', error);
                    const container = document.getElementById(tableId);

                    if (container) {
                        container.innerHTML = '<div class="error-message">Failed to load match details</div>';
                    }
                }
            }

            // Function to fetch data for a specific range
            async function fetchScores(range, tableId) {
                try {
                    console.log(`Fetching scores for ${tableId} with range ${range}`);
                    const rows = await fetchRangeValues(range);
                    console.log(`Data received for ${tableId}:`, rows);

                    if (rows && rows.length > 0) {
                        const scoreboardDiv = document.getElementById(tableId);

                        if (!scoreboardDiv) {
                            console.error(`Scoreboard element not found: ${tableId}`);
                            return;
                        }

                        scoreboardDiv.innerHTML = "";

                        const rankingRows = mapRankingRows(rows);
                        const isWinnerKnown = isWinnerKnownForTable(tableId);

                        if (rankingRows.length > 0 && rankingRows.every(row => scoreAsNumber(row.score) === 0)) {
                            renderStartingSoon(scoreboardDiv);
                            return;
                        }

                        rankingRows.forEach((row, index) => {
                            const playerRow = document.createElement('div');
                            playerRow.className = 'player-row scoreboard-row';

                            if (isWinnerKnown && index === 0) {
                                playerRow.classList.add('is-winner-known');
                            }

                            const rankDiv = document.createElement('div');
                            rankDiv.className = 'player-rank';
                            rankDiv.textContent = row.rank + '.';

                            const nameDiv = document.createElement('div');
                            nameDiv.className = 'player-name';
                            nameDiv.appendChild(document.createTextNode(row.name));

                            if (isWinnerKnown && index === 0) {
                                const winnerTag = document.createElement('span');
                                winnerTag.className = 'winner-tag';
                                winnerTag.textContent = 'Vainqueur';
                                nameDiv.appendChild(winnerTag);
                            }

                            const scoreDiv = document.createElement('div');
                            scoreDiv.className = 'player-score';
                            scoreDiv.textContent = row.score;

                            playerRow.appendChild(rankDiv);
                            playerRow.appendChild(nameDiv);
                            playerRow.appendChild(scoreDiv);
                            scoreboardDiv.appendChild(playerRow);
                        });

                    } else {
                        console.error(`No values found for range: ${range}`);
                        document.getElementById(tableId).innerHTML = '<div class="error-message">No data available</div>';
                    }
                } catch (error) {
                    console.error('Error fetching scores:', error);
                    document.getElementById(tableId).innerHTML = '<div class="error-message">Failed to load scores</div>';
                }
            }

            // Add keyboard shortcuts to toggle slide visibility
            document.addEventListener('keydown', (event) => {
                const slideKeyMap = {
                    '0': 'slide0',
                    '1': 'slide1',
                    '2': 'slide2',
                    '3': 'slide3',
                    '4': 'slide4',
                    '5': 'slide5',
                    '6': 'slide6',
                    '7': 'slide7',
                    '9': 'slide9',
                    'a': 'slide10',  // 'a' for slide 10
                    'b': 'slide11'   // 'b' for slide 11
                };

                if (event.altKey && slideKeyMap[event.key]) {
                    event.preventDefault();
                    toggleSlideVisibility(slideKeyMap[event.key]);
                }
            });

            // Function to fetch club ranking
            async function fetchClubRanking() {
                try {
                    console.log('Fetching club ranking...');
                    const rows = await fetchRangeValues(ranges.clubs);
                    console.log('Club ranking data received:', rows);

                    if (rows && rows.length > 0) {
                        const rankingDiv = document.getElementById('clubRankingTable');

                        if (!rankingDiv) {
                            console.error('Club ranking element not found');
                            return;
                        }

                        rankingDiv.innerHTML = "";

                        rows.forEach((row, index) => {
                            if (row.length >= 2 && !isUnavailable(row[1])) {
                                const rank = parseInt(row[0]);
                                // Only show ranks 1-5 and 28-32
                                if ((rank >= 1 && rank <= 5) || (rank >= 28 && rank <= 32)) {
                                    const clubRow = document.createElement('div');
                                    clubRow.className = 'player-row scoreboard-row club-row';

                                    const rankDiv = document.createElement('div');
                                    rankDiv.className = 'player-rank';
                                    rankDiv.textContent = row[0] + '.';

                                    const nameDiv = document.createElement('div');
                                    nameDiv.className = 'player-name';
                                    nameDiv.textContent = row[1];

                                    clubRow.appendChild(rankDiv);
                                    clubRow.appendChild(nameDiv);
                                    rankingDiv.appendChild(clubRow);
                                }
                            }
                        });
                    } else {
                        console.error('No values found for club ranking');
                        document.getElementById('clubRankingTable').innerHTML = '<div class="error-message">No data available</div>';
                    }
                } catch (error) {
                    console.error('Error fetching club ranking:', error);
                    document.getElementById('clubRankingTable').innerHTML = '<div class="error-message">Failed to load club ranking</div>';
                }
            }

            // Function to load all scores
            async function loadScores() {
                console.log('Starting to load scores...');
                try {
                    await Promise.all([
                        fetchScores(ranges.national, 'scoreTable1'),
                        fetchScores(ranges.p1, 'scoreTable2'),
                        fetchScores(ranges.p2, 'scoreTable3'),
                        fetchScores(ranges.p3, 'scoreTable4'),
                        fetchScores(ranges.p4, 'scoreTable5'),
                        fetchScores(ranges.p5, 'scoreTable6'),
                        fetchScores(ranges.p6, 'scoreTable7'),
                        fetchMatchDetails(ranges.matches, 'matchDetails1', 'NAT'),
                        fetchMatchDetails(ranges.matches, 'matchDetails2', 'P1'),
                        fetchMatchDetails(ranges.matches, 'matchDetails3', 'P2'),
                        fetchMatchDetails(ranges.matches, 'matchDetails4', 'P3'),
                        fetchMatchDetails(ranges.matches, 'matchDetails5', 'P4'),
                        fetchMatchDetails(ranges.matches, 'matchDetails6', 'P5'),
                        fetchMatchDetails(ranges.matches, 'matchDetails7', 'P6'),
                        fetchClubRanking()
                    ]);
                    console.log('All scores loaded successfully');
                } catch (error) {
                    console.error('Error loading scores:', error);
                }
            }
        </script>
    </body>
